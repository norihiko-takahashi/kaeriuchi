ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# @serwist/turbopack が固定している zod 4.6.5 には、high の脆弱性（GHSA-mrhx-c7xc-m3w5）がある。
# 同じ 4.6 系の修正版にそろえる。外すのは、serwist が 4.6.6 以上に上げたとき。
overrides:
  zod@4.6.5: 4.6.7

# 公開から3日（4320分）たっていない版は使わない（2026-11-08 に決定）。
# 公開直後の版に悪意のあるコードが混ざる攻撃（乗っ取られたアカウントからの公開など）を避けるため。
# Dependabot も同じ決まりで動いている。
minimumReleaseAge: 4320
